name: mirror-release-to-r2

# Optional fork-owned Cloudflare R2 mirror. Disabled unless the repository
# explicitly sets PAWWORK_FORK_R2_ENABLED=true and supplies fork-specific bucket
# and public-base variables. No release event is subscribed; the upstream
# pawwork.ai bucket is never used by this workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror (e.g. v2026.5.29)"
        required: true

concurrency:
  group: mirror-r2-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_BUCKET: ${{ vars.PAWWORK_FORK_R2_BUCKET }}
  DOWNLOAD_PUBLIC_BASE: ${{ vars.PAWWORK_FORK_DOWNLOAD_PUBLIC_BASE }}
  # Pass the tag via env, never interpolate ${{ }} into a run: script — an
  # attacker-controlled tag must reach the secrets-bearing steps as data, not
  # shell. Steps reference "$TAG" only.
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  mirror:
    if: ${{ vars.PAWWORK_FORK_R2_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release is complete (fail closed)
        run: pnpm --filter @pawwork/desktop exec tsx scripts/verify-release.ts "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror release assets to R2
        run: pnpm --filter @pawwork/desktop exec tsx scripts/mirror-release-to-r2.ts "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
